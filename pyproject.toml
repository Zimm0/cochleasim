[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cochleasim"
version = "0.1.0"
description = "Python library for simulation and validation of active human cochlear mechanics"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Antonio Perez Lopez", email = "zimmo04@icloud.com"}
]
keywords = [
    "cochlea",
    "cochlear mechanics",
    "auditory model",
    "biomechanics",
    "signal processing",
    "neural simulation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "control>=0.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "notebook>=7.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
"Homepage" = "https://github.com/Zimm0/cochleasim"
"Repository" = "https://github.com/Zimm0/cochleasim.git"
"Bug Tracker" = "https://github.com/Zimm0/cochleasim/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"cochleasim.data" = ["*.csv"]
"cochleasim.data.reference" = ["*.csv"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100