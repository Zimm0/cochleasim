[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cochleasim"
version = "0.1.0"
description = "Virtual testbench for cochlear implant coding strategy comparison"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Antonio Perez Lopez", email = "zimmo04@icloud.com"}
]
keywords = [
    "cochlear implant",
    "CI",
    "coding strategy",
    "signal processing",
    "neural simulation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "notebook>=7.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]
phase2 = [
    "numba>=0.57.0",
    "seaborn>=0.13.0",
]

[project.urls]
"Homepage" = "https://github.com/Zimm0/cochleasim"
"Documentation" = "https://cochleasim.readthedocs.io"
"Repository" = "https://github.com/Zimm0/cochleasim.git"
"Bug Tracker" = "https://github.com/Zimm0/cochleasim/issues"

[tool.setuptools]
packages = ["cochleasim"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v --cov=cochleasim --cov-report=html"